<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="760" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">J1-A (topside panel connector) → Pico 2 W screw-terminal breakout</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#444">Breaker OFF at the main panel while wiring. Each wire goes through a Y-splitter tail; the panel stays connected.</text>

  <!-- column headers -->
  <text x="160" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">J1-A pin (main board)</text>
  <text x="770" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Pico breakout terminal</text>

  <!-- rows: y = 120 + i*56 -->
  <g font-size="14">
    <!-- pin 1 -->
    <rect x="40" y="110" width="240" height="40" rx="6" fill="#f2f2f2" stroke="#888"/>
    <text x="56" y="136" fill="#111"><tspan font-weight="bold">1</tspan>  unknown (steady 5 V)</text>
    <line x1="280" y1="130" x2="690" y2="130" stroke="#888" stroke-width="4"/>
    <rect x="690" y="110" width="160" height="40" rx="6" fill="#f2f2f2" stroke="#888"/>
    <text x="770" y="136" text-anchor="middle" font-weight="bold" fill="#111">GP5</text>
    <text x="485" y="122" text-anchor="middle" font-size="12" fill="#666">listen only</text>

    <!-- pin 2 -->
    <rect x="40" y="166" width="240" height="40" rx="6" fill="#f2f2f2" stroke="#888"/>
    <text x="56" y="192" fill="#111"><tspan font-weight="bold">2</tspan>  unknown (steady 5 V)</text>
    <line x1="280" y1="186" x2="690" y2="186" stroke="#888" stroke-width="4"/>
    <rect x="690" y="166" width="160" height="40" rx="6" fill="#f2f2f2" stroke="#888"/>
    <text x="770" y="192" text-anchor="middle" font-weight="bold" fill="#111">GP6</text>
    <text x="485" y="178" text-anchor="middle" font-size="12" fill="#666">listen only</text>

    <!-- pin 3 (conditional) -->
    <rect x="40" y="222" width="240" height="40" rx="6" fill="#f2f2f2" stroke="#888"/>
    <text x="56" y="248" fill="#111"><tspan font-weight="bold">3</tspan>  unknown (steady 0 V)</text>
    <line x1="280" y1="242" x2="690" y2="242" stroke="#888" stroke-width="4" stroke-dasharray="10 8"/>
    <rect x="690" y="222" width="160" height="40" rx="6" fill="#f2f2f2" stroke="#888"/>
    <text x="770" y="248" text-anchor="middle" font-weight="bold" fill="#111">GP7</text>
    <text x="485" y="234" text-anchor="middle" font-size="12" fill="#a33">only if pin 3 → GND measures under ~8 kΩ</text>

    <!-- pin 4 reply with resistor -->
    <rect x="40" y="278" width="240" height="40" rx="6" fill="#fff1e0" stroke="#d97706"/>
    <text x="56" y="304" fill="#111"><tspan font-weight="bold">4</tspan>  button REPLY</text>
    <line x1="280" y1="298" x2="440" y2="298" stroke="#d97706" stroke-width="4" stroke-dasharray="10 8"/>
    <polyline points="440,298 450,286 466,310 482,286 498,310 514,286 530,310 540,298" fill="none" stroke="#d97706" stroke-width="3"/>
    <line x1="540" y1="298" x2="690" y2="298" stroke="#d97706" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="490" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">470 Ω</text>
    <rect x="690" y="278" width="160" height="40" rx="6" fill="#fff1e0" stroke="#d97706"/>
    <text x="770" y="304" text-anchor="middle" font-weight="bold" fill="#111">GP4</text>
    <text x="360" y="290" text-anchor="middle" font-size="12" fill="#a33">step 7 only</text>

    <!-- pin 5 data -->
    <rect x="40" y="342" width="240" height="40" rx="6" fill="#e6f6ea" stroke="#15803d"/>
    <text x="56" y="368" fill="#111"><tspan font-weight="bold">5</tspan>  DATA</text>
    <line x1="280" y1="362" x2="690" y2="362" stroke="#15803d" stroke-width="4"/>
    <rect x="690" y="342" width="160" height="40" rx="6" fill="#e6f6ea" stroke="#15803d"/>
    <text x="770" y="368" text-anchor="middle" font-weight="bold" fill="#111">GP3</text>

    <!-- pin 6 clock -->
    <rect x="40" y="398" width="240" height="40" rx="6" fill="#e6efff" stroke="#1d4ed8"/>
    <text x="56" y="424" fill="#111"><tspan font-weight="bold">6</tspan>  CLOCK</text>
    <line x1="280" y1="418" x2="690" y2="418" stroke="#1d4ed8" stroke-width="4"/>
    <rect x="690" y="398" width="160" height="40" rx="6" fill="#e6efff" stroke="#1d4ed8"/>
    <text x="770" y="424" text-anchor="middle" font-weight="bold" fill="#111">GP2</text>

    <!-- pin 7 +5V -->
    <rect x="40" y="454" width="240" height="40" rx="6" fill="#fde8e8" stroke="#b91c1c"/>
    <text x="56" y="480" fill="#111"><tspan font-weight="bold">7</tspan>  +5 V</text>
    <line x1="280" y1="474" x2="690" y2="474" stroke="#b91c1c" stroke-width="4"/>
    <rect x="690" y="454" width="160" height="40" rx="6" fill="#fde8e8" stroke="#b91c1c"/>
    <text x="770" y="480" text-anchor="middle" font-weight="bold" fill="#111">VSYS</text>
    <text x="485" y="466" text-anchor="middle" font-size="12" fill="#666">powers the Pico (no USB at the tub)</text>

    <!-- pin 8 GND -->
    <rect x="40" y="510" width="240" height="40" rx="6" fill="#e5e5e5" stroke="#111"/>
    <text x="56" y="536" fill="#111"><tspan font-weight="bold">8</tspan>  GROUND</text>
    <line x1="280" y1="530" x2="690" y2="530" stroke="#111" stroke-width="4"/>
    <rect x="690" y="510" width="160" height="40" rx="6" fill="#e5e5e5" stroke="#111"/>
    <text x="770" y="536" text-anchor="middle" font-weight="bold" fill="#111">GND</text>
  </g>

  <!-- inset: physical J1-A and splitters -->
  <g transform="translate(90,580)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#111">J1-A as seen on the board (PN text upright; RJ45 to the right)</text>
    <g font-size="14" text-anchor="middle">
      <rect x="0" y="14" width="232" height="96" rx="6" fill="#222"/>
      <!-- top row 1 3 5 7 -->
      <rect x="10" y="22" width="48" height="36" fill="#fafafa"/><text x="34" y="46">1</text>
      <rect x="66" y="22" width="48" height="36" fill="#fafafa"/><text x="90" y="46">3</text>
      <rect x="122" y="22" width="48" height="36" fill="#fafafa"/><text x="146" y="46">5</text>
      <rect x="178" y="22" width="48" height="36" fill="#fafafa"/><text x="202" y="46">7</text>
      <!-- bottom row 2 4 6 8 -->
      <rect x="10" y="66" width="48" height="36" fill="#fafafa"/><text x="34" y="90">2</text>
      <rect x="66" y="66" width="48" height="36" fill="#fafafa"/><text x="90" y="90">4</text>
      <rect x="122" y="66" width="48" height="36" fill="#fafafa"/><text x="146" y="90">6</text>
      <rect x="178" y="66" width="48" height="36" fill="#fafafa"/><text x="202" y="90">8</text>
      <text x="34" y="132" font-weight="bold" fill="#111">S1</text>
      <text x="90" y="132" font-weight="bold" fill="#111">S2</text>
      <text x="146" y="132" font-weight="bold" fill="#111">S3</text>
      <text x="202" y="132" font-weight="bold" fill="#111">S4</text>
      <text x="-14" y="46" font-size="11" fill="#444" text-anchor="end">top</text>
      <text x="-14" y="90" font-size="11" fill="#444" text-anchor="end">bottom</text>
    </g>
    <g font-size="13" fill="#222">
      <text x="270" y="34">• One Y-splitter per column: <tspan font-weight="bold">S1 = pins 1/2 … S4 = pins 7/8</tspan>.</text>
      <text x="270" y="56">• Splitter's single end → J1-A. Dot on each plug = top-row side.</text>
      <text x="270" y="78">• Tail A of S1–S4 → 2×4 male-male block → panel plug (paint dots matched).</text>
      <text x="270" y="100">• Tail B → male-male jumpers → Pico terminals (table above).</text>
      <text x="270" y="122">• Pin 4 (reply) stays unconnected until step 7 of docs/SETUP.md.</text>
    </g>
  </g>
</svg>
