<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="800" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Reply line through the 5 V buffer: Pico → Pixel Shifter → diode → J1-A pin 4</text>
  <text x="480" y="62" text-anchor="middle" font-size="14" fill="#444">Breaker OFF at the main panel while wiring. Every other wire (J1-A pins 1, 2, 3, 5, 6, 7, 8 → Pico) stays as it is.</text>

  <!-- ===== Pico breakout ===== -->
  <text x="150" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Pico breakout terminals</text>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#666">(use the labels printed on the breakout)</text>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#111">
    <rect x="60" y="150" width="180" height="40" rx="6" fill="#e5e5e5" stroke="#111"/>
    <text x="150" y="176">GND</text>
    <rect x="60" y="210" width="180" height="40" rx="6" fill="#fde2e2" stroke="#b91c1c"/>
    <text x="150" y="236">3V3 (OUT)</text>
    <rect x="60" y="270" width="180" height="40" rx="6" fill="#fff1e0" stroke="#d97706"/>
    <text x="150" y="296">GP4</text>
    <rect x="60" y="330" width="180" height="40" rx="6" fill="#e5e5e5" stroke="#111"/>
    <text x="150" y="356">GND (another one)</text>
  </g>

  <!-- ===== Adafruit Pixel Shifter ===== -->
  <rect x="380" y="120" width="300" height="290" rx="14" fill="#1f1f1f"/>
  <text x="530" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Adafruit Pixel Shifter (#6066)</text>
  <!-- input block -->
  <rect x="400" y="150" width="70" height="230" rx="4" fill="#2f9e6a"/>
  <text x="435" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">INPUT</text>
  <!-- output block -->
  <rect x="590" y="150" width="70" height="230" rx="4" fill="#2f9e6a"/>
  <text x="625" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">OUTPUT</text>
  <g font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <!-- input screws: G, V, DAT, CLK at y 170, 230, 290, 350 -->
    <circle cx="420" cy="170" r="10" fill="#ddd"/><text x="452" y="175">G</text>
    <circle cx="420" cy="230" r="10" fill="#ddd"/><text x="452" y="235">V</text>
    <circle cx="420" cy="290" r="10" fill="#ddd"/><text x="452" y="295">DAT</text>
    <circle cx="420" cy="350" r="10" fill="#ddd"/><text x="452" y="355">CLK</text>
    <!-- output screws: G, D5, !D5, C5 -->
    <circle cx="640" cy="170" r="10" fill="#ddd"/><text x="608" y="175">G</text>
    <circle cx="640" cy="230" r="10" fill="#ddd"/><text x="608" y="235">D5</text>
    <circle cx="640" cy="290" r="10" fill="#ddd"/><text x="606" y="295">!D5</text>
    <circle cx="640" cy="350" r="10" fill="#ddd"/><text x="608" y="355">C5</text>
  </g>

  <!-- wires Pico -> input -->
  <line x1="240" y1="170" x2="410" y2="170" stroke="#111" stroke-width="4"/>
  <line x1="240" y1="230" x2="410" y2="230" stroke="#b91c1c" stroke-width="4"/>
  <line x1="240" y1="290" x2="410" y2="290" stroke="#d97706" stroke-width="4"/>
  <line x1="240" y1="350" x2="410" y2="350" stroke="#111" stroke-width="4"/>
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="325" y="162">ground</text>
    <text x="325" y="222">power for the shifter</text>
    <text x="325" y="282">reply signal (3.3 V)</text>
    <text x="325" y="342">ties unused input low</text>
  </g>

  <!-- unused outputs -->
  <g font-size="12" fill="#b91c1c" font-weight="bold">
    <text x="690" y="175">nothing</text>
    <text x="690" y="295">nothing (inverted!)</text>
    <text x="690" y="355">nothing</text>
  </g>

  <!-- D5 -> diode -> pin 4 : route out to the right then down -->
  <line x1="650" y1="230" x2="700" y2="230" stroke="#d97706" stroke-width="4"/>
  <!-- diode drawn as the real part, horizontal -->
  <line x1="700" y1="230" x2="730" y2="230" stroke="#888" stroke-width="3"/>
  <rect x="730" y="218" width="60" height="24" rx="5" fill="#f3d9b1" stroke="#7a5a2a"/>
  <rect x="776" y="218" width="10" height="24" fill="#111"/>
  <line x1="790" y1="230" x2="815" y2="230" stroke="#888" stroke-width="3"/>
  <text x="760" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">BAT85 diode</text>
  <text x="781" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">stripe</text>
  <line x1="781" y1="250" x2="781" y2="244" stroke="#111" stroke-width="2"/>
  <!-- jumper to J1-A pin 4 -->
  <line x1="815" y1="230" x2="860" y2="230" stroke="#d97706" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="860" y1="230" x2="860" y2="460" stroke="#d97706" stroke-width="4" stroke-dasharray="10 8"/>
  <rect x="800" y="460" width="130" height="56" rx="6" fill="#fff1e0" stroke="#d97706"/>
  <text x="865" y="484" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">J1-A pin 4</text>
  <text x="865" y="504" text-anchor="middle" font-size="12" fill="#444">button REPLY</text>
  <text x="872" y="360" font-size="12" fill="#444">the old pin 4</text>
  <text x="872" y="376" font-size="12" fill="#444">jumper (it no</text>
  <text x="872" y="392" font-size="12" fill="#444">longer goes</text>
  <text x="872" y="408" font-size="12" fill="#444">to GP4)</text>

  <!-- ===== how-to box ===== -->
  <g transform="translate(40,440)">
    <rect x="0" y="0" width="730" height="330" rx="10" fill="#f7f7f7" stroke="#bbb"/>
    <text x="20" y="30" font-size="15" font-weight="bold" fill="#111">Making the diode connection (no soldering)</text>
    <g font-size="13" fill="#222">
      <text x="20" y="54">• Plain end of the diode (no stripe) → clamp in the Pixel Shifter's <tspan font-weight="bold">D5</tspan> terminal.</text>
      <text x="20" y="76">• Striped end → push into the <tspan font-weight="bold">female</tspan> end of the jumper that goes to J1-A pin 4.</text>
      <text x="36" y="96">If that jumper ends in a male pin, add a short female–female jumper between them.</text>
      <text x="20" y="118">• Cover the joint with heat-shrink or electrical tape so it can't touch anything or pull loose.</text>
      <text x="20" y="140">• <tspan font-weight="bold">Stripe always points toward pin 4.</tspan> Backwards = presses just don't arrive (nothing is damaged).</text>
    </g>
    <text x="20" y="176" font-size="15" font-weight="bold" fill="#111">Order matters (docs/SETUP.md step 8)</text>
    <g font-size="13" fill="#222">
      <text x="20" y="200">1. Breaker off. Move the pin 4 jumper off GP4 and tape its end. Wire the Shifter (left side of this</text>
      <text x="36" y="218">drawing) and put the diode in D5, but leave the diode's striped end <tspan font-weight="bold">unconnected</tspan> for now.</text>
      <text x="20" y="242">2. Breaker on. Set <tspan font-family="Menlo, monospace" font-weight="bold">reply_buffer: diode</tspan> in jacuzzi_panel.yaml and flash over Wi-Fi.</text>
      <text x="36" y="260">The boot log must say <tspan font-family="Menlo, monospace">Reply wiring: diode</tspan>.</text>
      <text x="20" y="284">3. Breaker off. Connect the diode's striped end to the pin 4 jumper. Breaker on.</text>
      <text x="20" y="308">4. Check the real panel buttons still work, then test Control (SETUP.md step 8).</text>
    </g>
  </g>
  <g transform="translate(790,560)">
    <rect x="0" y="0" width="140" height="210" rx="10" fill="#fff5f5" stroke="#b91c1c"/>
    <text x="70" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">Never</text>
    <g font-size="12" fill="#222">
      <text x="12" y="54">• use !D5 (it's</text>
      <text x="22" y="70">high when idle)</text>
      <text x="12" y="96">• connect the diode</text>
      <text x="22" y="112">to pin 4 while the</text>
      <text x="22" y="128">yaml still says</text>
      <text x="22" y="144" font-family="Menlo, monospace">none</text>
      <text x="12" y="170">• wire with the</text>
      <text x="22" y="186">breaker on</text>
    </g>
  </g>
</svg>
