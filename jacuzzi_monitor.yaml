esphome:
  name: jacuzzi-monitor
  friendly_name: Jacuzzi J355 Monitor
  on_boot:
    priority: 600
    then:
      # GPIO21 is the RS-485 DE/RE flow control pin. Hold LOW permanently for receive-only mode.
      - output.turn_off: rs485_de_re

external_components:
  - source:
      type: local
      path: components
    components: [jacuzzi_monitor]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Jacuzzi-Monitor-AP"
    password: !secret ap_password

logger:
  level: DEBUG
  baud_rate: 115200

api:

ota:
  - platform: esphome
    password: !secret ota_password

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin:
    number: GPIO18
    inverted: true
  baud_rate: 38400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

output:
  - platform: gpio
    pin: GPIO21
    id: rs485_de_re

jacuzzi_monitor:
  uart_id: uart_bus
