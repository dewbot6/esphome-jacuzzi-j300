esphome:
  name: jacuzzi-monitor
  friendly_name: Jacuzzi J355 Monitor
  on_boot:
    priority: 600
    then:
      # GPIO21 is the RS-485 DE/RE flow control pin. Hold LOW permanently for receive-only mode.
      - output.turn_off: rs485_de_re

external_components:
  - source:
      type: local
      path: components
    components: [jacuzzi_monitor]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Jacuzzi-Monitor-AP"
    password: !secret ap_password

logger:
  level: DEBUG
  baud_rate: 115200

api:

ota:
  - platform: esphome
    password: !secret ota_password

output:
  - platform: gpio
    pin: GPIO21
    id: rs485_de_re

# Isolated RS-485 receiver used as a level shifter: A+ = RJ45 pin 4 (clock),
# B- = RJ45 pin 3 (ground). Its RX output is GPIO18. Nothing is ever transmitted.
jacuzzi_monitor:
  clock_pin: GPIO18
  water_temperature:
    name: Water Temperature
  set_temperature:
    name: Set Temperature
  display_temperature:
    name: Display
  heater:
    name: Heater
  jets1:
    name: Jets 1
  jets2:
    name: Jets 2
  slot5:
    name: Status Slot 5
  raw_frame:
    name: Raw Frame
